x-defaults: &defaults
  restart: unless-stopped
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"

services:
  homeassistant:
    <<: *defaults
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    image: lscr.io/linuxserver/homeassistant:2026.5.1@sha256:053dc1649ecadb6e6227d435eb3fa270a29658ef2320a780790c629f42f749ee
    network_mode: host
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Los_Angeles
    volumes:
      - ./config:/config
      - ./ha-cache:/config/.cache
      - ./ha-config:/config/.config
  matter:
    <<: *defaults
    read_only: true
    tmpfs:
      - /tmp
    image: ghcr.io/matter-js/python-matter-server:8.1.2@sha256:6827e352011e2d8c2bde771e446fcf72acc49150ef66bad978816bac1762aad3
    user: 1000:1000
    network_mode: host
    volumes:
      - ./matter:/data
