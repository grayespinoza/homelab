---
x-defaults: &defaults
  restart: unless-stopped
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  read_only: true
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"
services:
  uptime-kuma:
    <<: *defaults
    tmpfs:
      - /tmp
    image: louislam/uptime-kuma:2.5.11@sha256:7554dba313c84e44fee921ef3b5626ba1c711e412e82815e8c957517026112a9
    user: 1000:1000
    ports:
      - 3001:3001/tcp
    volumes:
      - ./data:/app/data
