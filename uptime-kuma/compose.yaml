---
x-defaults: &defaults
  restart: unless-stopped
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  read_only: true
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"
services:
  uptime-kuma:
    <<: *defaults
    tmpfs:
      - /tmp
    image: louislam/uptime-kuma:2.5.9@sha256:e88415a90dd2f7efecdbc18de0490aff292764a3ac471531bf1d0481725591bd
    user: 1000:1000
    ports:
      - 3001:3001/tcp
    volumes:
      - ./data:/app/data
