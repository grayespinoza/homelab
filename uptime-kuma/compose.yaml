---
x-defaults: &defaults
  restart: unless-stopped
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  read_only: true
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"
services:
  uptime-kuma:
    <<: *defaults
    tmpfs:
      - /tmp
    image: louislam/uptime-kuma:2.5.4@sha256:917318f9d7be5257f43ba412c766a473be336eb451d70744f3b482d0c3997c0e
    user: 1000:1000
    ports:
      - 3001:3001/tcp
    volumes:
      - ./data:/app/data
