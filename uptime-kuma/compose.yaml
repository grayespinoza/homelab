---
x-defaults: &defaults
  restart: unless-stopped
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  read_only: true
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"
services:
  uptime-kuma:
    <<: *defaults
    tmpfs:
      - /tmp
    image: louislam/uptime-kuma:2.5.5@sha256:c74379ac4509ce2d2c2633f509e67003ee2e45b6e995c5e43fc101f45a0e1fbe
    user: 1000:1000
    ports:
      - 3001:3001/tcp
    volumes:
      - ./data:/app/data
